[project]
name = "findex"
version = "1.0.0"
description = "Python lexical, semantic and hybrid search with NumPy ranking, MiniLM and FastAPI"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Oleksandr Kalinichenko"}]
keywords = ["search", "inverted-index", "bm25", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "typer>=0.15.0",
  "rich>=13.7.0",
  "psutil>=7.1.3",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "jinja2>=3.1,<4",
  "numpy>=2.2,<3",
  "onnxruntime>=1.22,<2",
  "tokenizers>=0.21,<1",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "pytest-benchmark>=5,<6",
  "hypothesis>=6.0",
  "matplotlib>=3.10.0",
  "pyright>=1.1.390",
  "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: integration or end-to-end tests taking more than one second",
]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
