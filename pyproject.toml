[project]
name = "findex"
version = "0.4.0"
description = "Installable Python full-text search engine with Boolean queries and BM25/TF-IDF ranking"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Oleksandr Kalinichenko"}]
keywords = ["search", "inverted-index", "bm25", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "typer>=0.15.0",
  "rich>=13.7.0",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "hypothesis>=6.0",
  "pyright>=1.1.390",
  "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: integration or end-to-end tests taking more than one second",
]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
