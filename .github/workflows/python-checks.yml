name: Python checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync
      - name: Run tests
        run: uv run pytest -q
      - name: Lint Python
        run: uv run ruff check .
