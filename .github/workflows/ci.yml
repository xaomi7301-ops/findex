name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Install Python
        run: uv python install 3.13
      - name: Sync from uv.lock
        run: uv sync
      - name: Pyright strict
        run: uv run pyright
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pytest and coverage
        run: uv run pytest -q --cov=findex --cov-report=term-missing --benchmark-json=benchmark-ci.json
      - name: Upload benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: pytest-benchmark
          path: benchmark-ci.json
      - name: Build wheel
        run: uv build
      - name: Install wheel and smoke test
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv tool run --from "$wheel" findex --help
      - name: Ruff format
        run: uv run ruff format --check .
